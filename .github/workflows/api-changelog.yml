name: API changelog

on:
  pull_request:
    paths:
      - 'apps/api/**'

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require an apps/api/CHANGELOG.md entry
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if git diff --name-only "$base"...HEAD | grep -qx 'apps/api/CHANGELOG.md'; then
            echo "CHANGELOG entry found"
          else
            echo "::error file=apps/api/CHANGELOG.md::Every PR that touches apps/api must add a line under '## Unreleased' in apps/api/CHANGELOG.md (create the file with that heading if it does not exist). Format: '- <summary> (#<PR number>)'."
            exit 1
          fi
