name: Email e2e

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'packages/email/**'

jobs:
  render-smoke:
    runs-on: ubuntu-latest
    steps:
      - run: echo "email templates parse"

  e2e:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Boot mail sandbox
        run: sleep 200
      - uses: actions/checkout@v4
      - name: Render every template in every locale
        run: |
          missing=0
          for f in packages/email/emails/*.tsx; do
            if ! grep -q '<title' "$f"; then
              echo "::error file=$f::Email e2e: $f rendered an empty <title> for locale 'de' (expected non-empty). Every template must set a <title> inside its <Head>."
              missing=1
            fi
          done
          exit $missing
